    type: file
    path: .github/workflows/push-cloudflare.yaml
    quote:
      - "branches: [main, uat, release*]"
      - "run: sed -i \"s/\\${D1_DATABASE_ID}/${{ secrets.D1_DATABASE_ID }}/g\" wrangler.toml"
  - id: run-build-ok
    type: url
    url: https://github.com/cowdedroyal-lab/warden-worker/actions/runs/19848709388
    note: 2025-12-02 Build 成功（同日 19848535603 首次构建失败）
  - id: run-frontend-ok
    type: url
    url: https://github.com/cowdedroyal-lab/warden-worker/actions/runs/19850723452
    note: 2025-12-02 Deploy Frontend 成功
  - id: learning-notes
    type: file
    path: LEARNING.md
    quote: ["服务端再用 WebCrypto 的 PBKDF2-SHA256 加盐派生一次再存"]
  - id: crypto-code
    type: file
    path: src/crypto.rs
    quote:
      - "/// Hashes the client-provided master password hash with server-side PBKDF2."
      - "Ok(constant_time_eq("
